[package]
name = "token-enforcer-rs"
authors = ["Hamza El Marjani <hamzaelmarjani@gmail.com>"]
version = "0.1.0"
edition = "2024"
description = "Per-tenant LLM token budget enforcement library for Rust apps"
license = "MIT"
repository = "https://github.com/hamzaelmarjani/token-enforcer-rs"

[lib]
name = "token_enforcer"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
deadpool-redis = "0.14"
# Match the version used by deadpool-redis 0.14
redis = { version = "0.24", features = ["aio", "tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
dotenvy = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
axum = "0.7"
actix-web = "4"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
